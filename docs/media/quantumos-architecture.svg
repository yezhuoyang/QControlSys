<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="896" viewBox="0 0 1200 896" role="img" aria-labelledby="t d">
<title id="t">QuantumOS architecture: from a logical quantum program to the hardware</title>
<desc id="d">A logical quantum program is lowered by fault-tolerant compilation to the Fault-Tolerant Quantum Execution Interface, written in QSysASM. The interface has two kinds of statement: physical instructions (H, S, S dagger, X, Z, CNOT, CZ, CY, measure) on physical qubits, and system calls (request_ancilla, release_ancilla, request_magic, route, decode_syndrome, pauli_frame_update) that delegate shared resources to the operating system. The Quantum OS manages resources and executes the program: a scheduler, a resource VM, a machine declaration and shared services. It runs on RISC-Q, a control system of RV32I cores, a board hub, decoder cores and converters, which drives superconducting, trapped-ion and neutral-atom qubits. Measured costs flow back up to the machine declaration.</desc>
<style>
  text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
  .mono { font-family: "Cascadia Code", Consolas, Menlo, "DejaVu Sans Mono", monospace; }
  .t1 { font-size: 22px; font-weight: 700; }
  .t2 { font-size: 20px; font-weight: 700; }
  .t3 { font-size: 17px; font-weight: 700; }
  .t4 { font-size: 14px; font-weight: 700; }
  .sub { font-size: 14px; fill: #586174; }
  .small { font-size: 12.5px; fill: #586174; }
  .plat { font-size: 16px; font-weight: 600; }
  .chip { font-size: 14px; }
  .phys rect { fill: #ecfdf5; stroke: #a7f3d0; }
  .phys text { fill: #065f46; }
  .sys rect { fill: #eef2ff; stroke: #c7d2fe; }
  .sys text { fill: #3730a3; }
  .arrow { stroke: #8a93a6; stroke-width: 1.6; fill: none; }
  .flow { stroke-dasharray: 5 7; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -12; } }
  @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
</style>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#8a93a6" />
  </marker>
  <marker id="headi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#6366f1" />
  </marker>
</defs>

<rect width="1200" height="896" fill="#fafbfd" />

<!-- Logical quantum program -->
<rect x="290" y="28" width="560" height="76" rx="14" fill="#ffffff" stroke="#dde1ea" />
<text class="t2" x="570" y="60" text-anchor="middle">Logical quantum program</text>
<text class="sub" x="570" y="86" text-anchor="middle">Code blocks, lattice-surgery merges, T gates, logical measurements</text>

<path class="arrow" d="M570 104 V156" marker-end="url(#head)" />
<text class="sub" x="586" y="136">Fault-tolerant compilation</text>

<!-- Fault-Tolerant Quantum Execution Interface -->
<rect x="40" y="162" width="1060" height="258" rx="16" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5" />
<text class="t1" x="570" y="198" text-anchor="middle">Fault-Tolerant Quantum Execution Interface</text>
<rect x="526" y="210" width="88" height="25" rx="12.5" fill="#eef2ff" stroke="#c7d2fe" />
<text class="mono" x="570" y="227.5" text-anchor="middle" font-size="14" font-weight="600" style="fill:#4338ca">QSysASM</text>

<!-- Physical instructions -->
<rect x="64" y="250" width="496" height="150" rx="12" fill="#f7f8fc" stroke="#dde1ea" />
<text class="t3" x="84" y="278">Physical instructions</text>
<text class="small" x="84" y="299">Clifford gates and measurements on physical qubits</text>
<g class="phys mono chip">
  <rect x="84" y="314" width="34" height="30" rx="7" /><text x="101" y="334" text-anchor="middle">H</text>
  <rect x="126" y="314" width="34" height="30" rx="7" /><text x="143" y="334" text-anchor="middle">S</text>
  <rect x="168" y="314" width="40" height="30" rx="7" /><text x="188" y="334" text-anchor="middle">S†</text>
  <rect x="216" y="314" width="34" height="30" rx="7" /><text x="233" y="334" text-anchor="middle">X</text>
  <rect x="258" y="314" width="34" height="30" rx="7" /><text x="275" y="334" text-anchor="middle">Z</text>
  <rect x="84" y="352" width="52" height="30" rx="7" /><text x="110" y="372" text-anchor="middle">CNOT</text>
  <rect x="144" y="352" width="40" height="30" rx="7" /><text x="164" y="372" text-anchor="middle">CZ</text>
  <rect x="192" y="352" width="40" height="30" rx="7" /><text x="212" y="372" text-anchor="middle">CY</text>
  <rect x="240" y="352" width="78" height="30" rx="7" /><text x="279" y="372" text-anchor="middle">measure</text>
</g>

<!-- System calls -->
<rect x="580" y="250" width="496" height="150" rx="12" fill="#f7f8fc" stroke="#dde1ea" />
<text class="t3" x="600" y="278">System calls</text>
<text class="small" x="600" y="299">Delegated to the OS: allocation, routing, magic states, decoding</text>
<g class="sys mono chip">
  <rect x="600" y="314" width="144" height="30" rx="7" /><text x="672" y="334" text-anchor="middle">request_ancilla</text>
  <rect x="752" y="314" width="144" height="30" rx="7" /><text x="824" y="334" text-anchor="middle">release_ancilla</text>
  <rect x="904" y="314" width="128" height="30" rx="7" /><text x="968" y="334" text-anchor="middle">request_magic</text>
  <rect x="600" y="352" width="62" height="30" rx="7" /><text x="631" y="372" text-anchor="middle">route</text>
  <rect x="670" y="352" width="144" height="30" rx="7" /><text x="742" y="372" text-anchor="middle">decode_syndrome</text>
  <rect x="822" y="352" width="170" height="30" rx="7" /><text x="907" y="372" text-anchor="middle">pauli_frame_update</text>
</g>

<path class="arrow" d="M570 420 V466" marker-end="url(#head)" />

<!-- Quantum OS -->
<rect x="40" y="472" width="1060" height="146" rx="16" fill="#ffffff" stroke="#dde1ea" />
<text class="t2" x="570" y="504" text-anchor="middle">Quantum OS</text>
<text class="sub" x="570" y="528" text-anchor="middle">Resource management and execution</text>
<g>
  <rect x="64" y="546" width="244" height="54" rx="10" fill="#f7f8fc" stroke="#e5e8f0" />
  <text class="t4" x="80" y="568">Scheduler</text>
  <text class="small" x="80" y="589">Turns contention into waiting</text>
  <rect x="320" y="546" width="244" height="54" rx="10" fill="#f7f8fc" stroke="#e5e8f0" />
  <text class="t4" x="336" y="568">Resource VM</text>
  <text class="small" x="336" y="589">Admits a program or names its limit</text>
  <rect x="576" y="546" width="244" height="54" rx="10" fill="#f7f8fc" stroke="#e5e8f0" />
  <text class="t4" x="592" y="568">Machine declaration</text>
  <text class="small" x="592" y="589">Latency and capacity per service</text>
  <rect x="832" y="546" width="244" height="54" rx="10" fill="#f7f8fc" stroke="#e5e8f0" />
  <text class="t4" x="848" y="568">Shared services</text>
  <text class="small" x="848" y="589">Ancillas, factories, decoders</text>
</g>

<path class="arrow" d="M570 618 V664" marker-end="url(#head)" />

<!-- RISC-Q -->
<rect x="40" y="670" width="1060" height="86" rx="16" fill="#ffffff" stroke="#dde1ea" />
<text class="t2" x="570" y="702" text-anchor="middle">RISC-Q</text>
<text class="sub" x="570" y="728" text-anchor="middle">RV32I control cores, a board hub that shares measured bits, decoder cores, DACs and ADCs</text>

<!-- Measured costs flow back up -->
<path class="flow" d="M1100 713 H1140 V545 H1108" stroke="#6366f1" stroke-width="1.6" fill="none" marker-end="url(#headi)" />
<text class="small" transform="translate(1160 629) rotate(-90)" text-anchor="middle" style="fill:#4f46e5">measured costs</text>

<!-- Fan-out to the platforms -->
<path class="arrow" d="M570 756 V776 H210 V802" marker-end="url(#head)" />
<path class="arrow" d="M570 776 V802" marker-end="url(#head)" />
<path class="arrow" d="M570 776 H930 V802" marker-end="url(#head)" />

<!-- Superconducting -->
<rect x="60" y="808" width="300" height="64" rx="12" fill="#ffffff" stroke="#dde1ea" />
<g transform="translate(78 817)">
  <rect x="1" y="1" width="44" height="44" rx="9" fill="#eef3f6" stroke="#b8c8d2" />
  <path d="M19 9h8v10h10v8H27v10h-8V27H9v-8h10z" fill="#e3b23c" stroke="#7a5a10" stroke-width="1" />
  <path d="M33 33l4 4m-2-6 4 4" stroke="#b4692a" stroke-width="2" />
</g>
<text class="plat" x="140" y="846">Superconducting</text>

<!-- Trapped ion -->
<rect x="420" y="808" width="300" height="64" rx="12" fill="#ffffff" stroke="#dde1ea" />
<g transform="translate(438 817)">
  <rect x="1" y="1" width="44" height="44" rx="9" fill="#f4f1fb" stroke="#cfc4e6" />
  <rect x="7" y="13" width="32" height="20" rx="6" fill="none" stroke="#e8a0a8" stroke-width="2.5" />
  <circle cx="12" cy="13" r="4" fill="#26324a" /><circle cx="34" cy="33" r="4" fill="#26324a" />
  <rect x="18" y="9" width="10" height="7" rx="3.5" fill="#22b8cf" />
</g>
<text class="plat" x="500" y="846">Trapped ion</text>

<!-- Neutral atom -->
<rect x="780" y="808" width="300" height="64" rx="12" fill="#ffffff" stroke="#dde1ea" />
<g transform="translate(798 817)">
  <rect x="1" y="1" width="44" height="44" rx="9" fill="#10171d" />
  <g fill="#ffb45c"><circle cx="12" cy="14" r="2.5" /><circle cx="20" cy="14" r="2.5" /><circle cx="28" cy="14" r="2.5" /><circle cx="12" cy="22" r="2.5" /><circle cx="28" cy="22" r="2.5" /></g>
  <rect x="8" y="29" width="30" height="9" rx="2" fill="#3b4fd6" opacity=".55" />
  <path d="M20 4l-4 18h8z" fill="#ff7a5c" opacity=".55" /><circle cx="20" cy="22" r="2.5" fill="#fff2d0" />
</g>
<text class="plat" x="860" y="846">Neutral atom</text>
</svg>

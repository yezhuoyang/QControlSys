# quantumos.it.com: nginx site for QuantumOS on the qccd.academy droplet.
# Install as /etc/nginx/sites-available/quantumos.it.com and link it into sites-enabled.
# certbot --nginx adds the HTTPS server block and the redirect from HTTP (deploy/README.md).
#
#   https://quantumos.it.com/...  ->  http://127.0.0.1:8400/...   (docker-compose.prod.yml)

server {
    listen 80;
    listen [::]:80;
    server_name quantumos.it.com www.quantumos.it.com;

    # One canonical name: www goes to the bare domain.
    if ($host = www.quantumos.it.com) { return 301 https://quantumos.it.com$request_uri; }

    location / {
        proxy_pass http://127.0.0.1:8400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A QCCD Studio compile plus a Lean run can take tens of seconds on a busy server.
        proxy_read_timeout 300s;
        # Programs and hardware designs are posted as JSON; the server accepts up to 4 MB.
        client_max_body_size 5m;
        gzip on;
        gzip_types application/json text/css application/javascript image/svg+xml text/markdown;
        gzip_min_length 1024;
    }
}
